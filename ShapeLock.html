<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>シェイプロック</title>
    <style>
        body {
            text-align: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0d0d12;
            color: #ffffff;
            margin: 0;
            padding: 20px 10px;
            min-height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
            touch-action: none;
        }

        /* 右上ヘッダー／メニューバー */
        .top-header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            max-width: 360px;
            margin: 0 auto 5px auto;
            padding: 0 5px;
            position: relative;
        }

        /* ドロップダウン設定メニューのスタイル */
        .settings-menu-container {
            position: relative;
            display: inline-block;
        }

        .gear-btn {
            background: #1a1a24;
            color: #00e5ff;
            border: 1px solid #00e5ff;
            font-size: 16px;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(0, 229, 255, 0.2);
            transition: background 0.2s, color 0.2s;
            margin: 0;
        }

        .gear-btn:hover {
            background: #00e5ff;
            color: #0d0d12;
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            right: 0;
            top: 100%;
            margin-top: 5px;
            background: #1a1a24;
            border: 1px solid #00e5ff;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            z-index: 100;
            min-width: 200px;
            overflow: hidden;
        }

        .dropdown-menu.show {
            display: block;
        }

        .dropdown-item {
            width: 100%;
            padding: 10px 15px;
            text-align: left;
            background: transparent;
            color: #ffffff;
            border: none;
            border-bottom: 1px solid #2a2a38;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            margin: 0;
            border-radius: 0;
            transition: background 0.2s, color 0.2s;
        }

        .dropdown-item:last-child {
            border-bottom: none;
        }

        .dropdown-item:hover {
            background: #2a2a3a;
            color: #00e5ff;
        }

        .dropdown-item.active-mode {
            color: #00e5ff;
            background: #12121a;
            font-weight: bold;
        }

        /* コンテナ */
        .bottom-group-container {
            position: relative;
            top: -25px;            
            margin-bottom: -25px;   
        }

        /* プログレスバー（ロードゲージ）のスタイル */
        #loader-container {
            width: 80%;
            max-width: 300px;
            margin: 15px auto;
            background: #1a1a24;
            border-radius: 10px;
            padding: 4px;
            border: 1px solid #333;
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.2);
            transition: opacity 0.4s ease, visibility 0.4s;
        }
        #loader-bar {
            width: 0%;
            height: 12px;
            background: linear-gradient(90deg, #007bff, #00e5ff);
            border-radius: 6px;
            transition: width 0.3s ease;
        }
        #loader-text {
            font-size: 11px;
            color: #00e5ff;
            margin-top: 5px;
            font-weight: bold;
        }

        #debug-info {
            font-size: 11px;
            color: #bbb;
            background: #111;
            padding: 8px;
            display: inline-block;
            border-radius: 6px;
            max-width: 90%;
            word-break: break-all;
            margin-top: 15px;      
            border: 1px solid #222;
        }

        #system-status {
            font-size: 20px;
            color: #00e5ff;
            font-weight: bold;
            margin: 5px 0 10px 0;
            height: 35px;
        }
        #result-display {
            font-size: 15px;
            color: #aaa;
            margin: 5px 0 15px 0;
            height: 40px;
            padding: 0 10px;
        }

        /* カウンター表示エリア */
        .counter-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: 13px;
            margin: 5px 0;
            color: #aaaaaa;
        }
        .count-success { color: #4caf50; font-weight: bold; }
        .count-error { color: #f44336; font-weight: bold; }

        /* 固定答えモード時専用の動画ボタンエリア */
        .video-action-container {
            margin: 8px 0;
            min-height: 32px;
        }

        #pin-preview {
            font-size: 13px;
            color: #ffca28;
            background: #1e1e24;
            padding: 8px;
            border-radius: 6px;
            margin: 10px auto;
            max-width: 90%;
            border: 1px solid #3a3a4a;
            min-height: 18px;
        }
        #timer-display {
            font-size: 16px;
            color: #00ff66;
            font-family: monospace;
            margin: 5px 0;
            height: 20px;
        }
        #canvas-container {
            margin: 15px auto;
            width: 250px;
            height: 250px;
        }
        canvas {
            border: 2px solid #333;
            background: #ffffff;
            cursor: crosshair;
            box-shadow: 0 4px 25px rgba(0, 229, 255, 0.15);
            border-radius: 16px;
            display: block;
        }
        
        canvas.locked {
            background: #e0e0e0 !important;
            border-color: #555;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .controls {
            margin: 15px 0;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 5px;
        }
        button {
            padding: 10px 15px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            border: none;
            background: #007bff;
            color: white;
            margin: 3px;
            transition: background 0.2s;
        }
        button:disabled {
            background: #222;
            color: #555;
            cursor: not-allowed;
            border: 1px solid #333;
        }
        button.verify-btn {
            background: #454552;
            color: #ffca28;
            border: 1px solid #ffca28;
        }
        button.restart-btn {
            background: #2e2a14;
            color: #ffd54f;
            border: 1px solid #ffd54f;
        }
        button.reset-count-btn {
            background: #2d1a1a;
            color: #ff5252;
            border: 1px solid #ff5252;
        }

        /* 動画オーバーレイ用スタイル */
        #video-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        #video-overlay.show {
            display: flex;
        }
        #fullscreen-video {
            max-width: 90%;
            max-height: 75vh;
            border-radius: 8px;
            outline: none;
        }
        .close-video-btn {
            margin-top: 20px;
            background: #ff5252;
            color: white;
            padding: 10px 25px;
            font-size: 14px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        .close-video-btn:hover {
            background: #ff7979;
        }
        
        .label-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            background: #1a1a24;
            border-radius: 6px;
            margin: 0 3px;
            border: 1px solid #333;
            vertical-align: middle;
        }
        .label-badge svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: #00e5ff;
            stroke-width: 2.2; 
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        
        .back-btn {
            display: inline-block;
            margin-top: 25px;
            color: #888888;
            font-size: 14px;
            text-decoration: none;
            transition: color 0.2s;
        }
        .back-btn:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- 右上のメニューバー -->
    <div class="top-header">
        <div class="settings-menu-container">
            <button class="gear-btn" id="gearBtn" onclick="toggleMenu(event)">⚙</button>
            <div class="dropdown-menu" id="dropdownMenu">
                <button class="dropdown-item active-mode" id="btnNormalMode" onclick="selectMode('normal')">通常モード (自由登録)</button>
                <button class="dropdown-item" id="btnFixedMode" onclick="selectMode('fixed')">固定答えモード (固定解)</button>
            </div>
        </div>
    </div>

    <div id="system-status"> システム起動中... </div>
    
    <!-- プログレスバー（ロードゲージ） -->
    <div id="loader-container">
        <div id="loader-bar"></div>
        <div id="loader-text">AIモデル読み込み中... 0%</div>
    </div>

    <div id="result-display">AIモデルの読み込みを待っています。</div>
    
    <div class="counter-container">
        <div>成功: <span id="success-count" class="count-success">0</span> 回</div>
        <div>失敗: <span id="error-count" class="count-error">0</span> 回</div>
    </div>

    <!-- カウント表示の下に配置した「動画を見る」ボタンエリア -->
    <div class="video-action-container">
        <button id="viewVideoBtn" class="verify-btn" onclick="openVideo()" style="display: none;" disabled>動画を見る</button>
    </div>

    <div id="pin-preview">登録された図形: (未登録)</div>
    <div id="timer-display">タイム: 0.00 秒</div>
    
    <div id="canvas-container">
        <canvas id="drawArea" width="224" height="224" style="width: 250px; height: 250px;"></canvas>
    </div>

    <div class="controls">
        <button id="viewBtn" class="verify-btn" onclick="togglePINVisibility()" disabled> 登録図形を確認</button>
        <button id="keepRestartBtn" class="restart-btn" onclick="restartInputOnly()" disabled>リスタート</button>
        <button id="actionBtn" onclick="switchMode()" disabled>認証モードへ移行</button>
        <button id="resetCountBtn" class="reset-count-btn" onclick="resetCounters()" disabled>カウントリセット</button>
    </div>

    <div class="bottom-group-container">
        <div>
            <a href="index.html" class="back-btn">メニューに戻る</a>
        </div>
        <div id="debug-info">準備中...</div>
    </div>

    <!-- 動画プレビュー用オーバーレイ -->
    <div id="video-overlay">
        <video id="fullscreen-video" controls playsinline webkit-playsinline>
            <source src="shape.mp4" type="video/mp4">
            お使いのブラウザは動画タグをサポートしていません。
        </video>
        <button class="close-video-btn" onclick="closeVideo()">閉じる</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <script>
        const URL = "https://teachablemachine.withgoogle.com/models/INFEA24FA/";
        let model, labels = [];
        
        let savedPIN = [];          
        let inputCount = 0;          
        let isAuthMode = false;      
        let systemLocked = false;    
        let isPINVisible = false;    
        let hasFailedTransition = false; 

        // 固定答えモード用変数
        let isFixedAnswerMode = false;
        const FIXED_PIN = ["〇", "△", "□", "⛥"];

        // カウント用変数
        let successCount = 0;
        let errorCount = 0;

        // タイマー用変数
        let startTime = null;
        let timerInterval = null;
        let isTiming = false;

        const canvas = document.getElementById('drawArea');
        const ctx = canvas.getContext('2d');
        const statusDisplay = document.getElementById('system-status');
        const resultDisplay = document.getElementById('result-display');
        const pinPreview = document.getElementById('pin-preview');
        const timerDisplay = document.getElementById('timer-display');
        const debugInfo = document.getElementById('debug-info');
        const successCountText = document.getElementById('success-count');
        const errorCountText = document.getElementById('error-count');

        const loaderContainer = document.getElementById('loader-container');
        const loaderBar = document.getElementById('loader-bar');
        const loaderText = document.getElementById('loader-text');

        function updateProgress(percent, message) {
            loaderBar.style.width = percent + "%";
            loaderText.innerText = `${message} (${percent}%)`;
        }

        const svgIcons = {
            "〇": `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5"/></svg>`,
            "△": `<svg viewBox="0 0 24 24"><polygon points="12,4.5 4,19.5 20,19.5"/></svg>`,
            "□": `<svg viewBox="0 0 24 24"><rect x="4.5" y="4.5" width="15" height="15" rx="1"/></svg>`,
            "⛥": `<svg viewBox="0 0 24 24"><path d="M12,3.5 L17.85,21.5 L3.34,10.38 L20.66,10.38 L6.15,21.5 Z"/></svg>`,
            "∞": `<svg viewBox="0 0 24 24"><path d="M12,12 C14,10 15.2,7.2 17.2,7.2 A4.8,4.8 0 1,1 17.2,16.8 C15.2,16.8 14,14 12,12 C10,14 8.8,16.8 6.8,16.8 A4.8,4.8 0 1,1 6.8,7.2 C8.8,7.2 10,10 12,12 Z"/></svg>`
        };

        function toggleMenu(e) {
            if (e) e.stopPropagation();
            const dropdown = document.getElementById('dropdownMenu');
            dropdown.classList.toggle('show');
        }

        function closeMenu() {
            const dropdown = document.getElementById('dropdownMenu');
            if (dropdown && dropdown.classList.contains('show')) {
                dropdown.classList.remove('show');
            }
        }

        window.addEventListener('click', function(e) {
            if (!e.target.matches('#gearBtn')) {
                closeMenu();
            }
        });

        function selectMode(mode) {
            closeMenu();
            const btnNormal = document.getElementById('btnNormalMode');
            const btnFixed = document.getElementById('btnFixedMode');

            if (mode === 'normal') {
                btnNormal.classList.add('active-mode');
                btnFixed.classList.remove('active-mode');
                changeAppMode('custom');
            } else if (mode === 'fixed') {
                btnFixed.classList.add('active-mode');
                btnNormal.classList.remove('active-mode');
                changeAppMode('fixed');
            }
        }

        async function initAI() {
            try {
                updateProgress(20, "AIライブラリ準備中...");
                updateProgress(50, "ニューラルネットワーク読み込み中...");
                model = await tmImage.load(URL + "model.json", URL + "metadata.json");
                
                updateProgress(85, "ラベル・設定データ構築中...");
                labels = model.getClassLabels();
                
                const localPIN = localStorage.getItem("savedPIN");
                if (localPIN) {
                    savedPIN = JSON.parse(localPIN);
                }

                updateProgress(100, "ロード完了！");

                setTimeout(() => {
                    loaderContainer.style.opacity = "0";
                    setTimeout(() => {
                        loaderContainer.style.display = "none";
                    }, 400);
                }, 300);

                if (savedPIN.length === 4) {
                    isAuthMode = true;
                    statusDisplay.innerHTML = " 図形認証モード実行中 ";
                    statusDisplay.style.color = "#ffca28";
                    resultDisplay.innerHTML = "保存されたデータがあります。順番通りに入力してください。 [進行度: _ _ _ _]";
                    document.getElementById('actionBtn').innerText = "登録からやり直す";
                    document.getElementById('actionBtn').disabled = false;
                    document.getElementById('viewBtn').disabled = false;
                } else {
                    statusDisplay.innerHTML = " 図形登録ステップ ";
                    resultDisplay.innerHTML = "一筆書きで図形を描いてね。離すと自動で登録されます (0/4)";
                    document.getElementById('actionBtn').innerText = "認証モードへ移行";
                    document.getElementById('actionBtn').disabled = true;
                    document.getElementById('viewBtn').disabled = true;
                }

                document.getElementById('keepRestartBtn').disabled = false;
                document.getElementById('resetCountBtn').disabled = false;

                successCount = parseInt(localStorage.getItem("ai_successCount")) || 0;
                errorCount = parseInt(localStorage.getItem("ai_errorCount")) || 0;
                updateCounterDisplay();

                updatePINDisplay();
                resetTimerDisplay();
                
                const formattedLabels = labels.map(label => {
                    const icon = svgIcons[label] || label;
                    return `<span class="label-badge">${icon}</span>`;
                }).join("");
                
                debugInfo.innerHTML = "対応モデルラベル: " + formattedLabels;
                clearCanvas();
            } catch (e) {
                statusDisplay.innerHTML = "❌ エラー: ロード失敗";
                loaderText.innerText = "読み込みエラーが発生しました";
                loaderBar.style.background = "#ff5252";
            }
        }

        function changeAppMode(modeVal) {
            if (!model) return;

            const actionBtn = document.getElementById('actionBtn');
            const viewVideoBtn = document.getElementById('viewVideoBtn');

            if (modeVal === "fixed") {
                isFixedAnswerMode = true;
                isAuthMode = true;
                savedPIN = [...FIXED_PIN];
                inputCount = 0;
                hasFailedTransition = false;
                systemLocked = false;
                isPINVisible = false;

                canvas.classList.remove('locked');
                resetTimerDisplay();

                statusDisplay.innerHTML = " 固定答えモード ";
                statusDisplay.style.color = "#00e5ff";
                resultDisplay.innerHTML = "固定答えがセットされました。順番通りに入力してください。 [進行度: _ _ _ _]";
                resultDisplay.style.color = "#00e5ff";

                actionBtn.style.display = "none";
                viewVideoBtn.style.display = "inline-block"; // 固定モードのときだけ表示
                viewVideoBtn.disabled = false;                // 有効化

                document.getElementById('viewBtn').innerText = "登録図形を確認";
                document.getElementById('viewBtn').disabled = false;
                
                updatePINDisplay();
            } else {
                isFixedAnswerMode = false;
                actionBtn.style.display = "inline-block";
                viewVideoBtn.style.display = "none"; // 通常モード時は非表示

                const localPIN = localStorage.getItem("savedPIN");
                if (localPIN) {
                    savedPIN = JSON.parse(localPIN);
                } else {
                    savedPIN = [];
                }
                
                isPINVisible = false;
                document.getElementById('viewBtn').innerText = "登録図形を確認";
                
                if (savedPIN.length === 4) {
                    isAuthMode = true;
                    inputCount = 0;
                    hasFailedTransition = false;
                    systemLocked = false;

                    canvas.classList.remove('locked');
                    resetTimerDisplay();

                    statusDisplay.innerHTML = " 図形認証モード実行中 ";
                    statusDisplay.style.color = "#ffca28";
                    resultDisplay.innerHTML = "保存されたデータがあります。順番通りに入力してください。 [進行度: _ _ _ _]";
                    resultDisplay.style.color = "#aaa";

                    actionBtn.innerText = "登録からやり直す";
                    actionBtn.disabled = false;
                    document.getElementById('viewBtn').disabled = false;
                } else {
                    isAuthMode = false;
                    savedPIN = [];
                    inputCount = 0;
                    hasFailedTransition = false;
                    systemLocked = false;

                    canvas.classList.remove('locked');
                    resetTimerDisplay();

                    statusDisplay.innerHTML = " 図形登録ステップ ";
                    statusDisplay.style.color = "#00e5ff";
                    resultDisplay.innerHTML = "一筆書きで図形を描いてください。指を離すと自動で登録されます (0/4)";
                    resultDisplay.style.color = "#aaa";

                    actionBtn.innerText = "認証モードへ移行";
                    actionBtn.disabled = true;
                    document.getElementById('viewBtn').disabled = true;
                }
                updatePINDisplay();
            }
            clearCanvas();
        }

        function switchMode() {
            if (!model) return;
            if (!isAuthMode) {
                if (savedPIN.length === 4) {
                    if (!confirm("図形登録を完了し、認証モードに移行しますか？")) return;
                    isAuthMode = true;
                    inputCount = 0;
                    hasFailedTransition = false;
                    systemLocked = false;
                    canvas.classList.remove('locked');
                    resetTimerDisplay();

                    statusDisplay.innerHTML = " 図形認証モード実行中 ";
                    statusDisplay.style.color = "#ffca28";
                    resultDisplay.innerHTML = "登録が完了しました。順番通りに入力してください。 [進行度: _ _ _ _]";
                    resultDisplay.style.color = "#aaa";
                    document.getElementById('actionBtn').innerText = "登録からやり直す";
                    clearCanvas();
                }
            } else {
                if (!confirm("登録された図形データをリセットして、最初から登録し直しますか？")) return;
                savedPIN = [];
                isAuthMode = false;
                inputCount = 0;
                hasFailedTransition = false;
                systemLocked = false;
                localStorage.removeItem("savedPIN");
                canvas.classList.remove('locked');
                resetTimerDisplay();

                statusDisplay.innerHTML = " 図形登録ステップ ";
                statusDisplay.style.color = "#00e5ff";
                resultDisplay.innerHTML = "一筆書きで図形を描いてください。指を離すと自動で登録されます (0/4)";
                statusDisplay.style.color = "#aaa";
                document.getElementById('actionBtn').innerText = "認証モードへ移行";
                document.getElementById('actionBtn').disabled = true;
                document.getElementById('viewBtn').disabled = true;
                updatePINDisplay();
                clearCanvas();
            }
        }

        // --- 動画の表示・非表示を制御する関数 ---
        function openVideo() {
            const overlay = document.getElementById('video-overlay');
            const video = document.getElementById('fullscreen-video');
            overlay.classList.add('show');
            video.currentTime = 0;
            video.play().catch(e => console.log("自動再生がブロックされました:", e));
        }

        function closeVideo() {
            const overlay = document.getElementById('video-overlay');
            const video = document.getElementById('fullscreen-video');
            video.pause();
            overlay.classList.remove('show');
        }

        function updateCounterDisplay() {
            successCountText.innerText = successCount;
            errorCountText.innerText = errorCount;
        }

        function resetCounters() {
            if (!model) return;
            if (!confirm("成功・失敗のカウント記録をリセットしてもよろしいですか？")) return;
            successCount = 0;
            errorCount = 0;
            localStorage.setItem("ai_successCount", 0);
            localStorage.setItem("ai_errorCount", 0);
            updateCounterDisplay();
            if (navigator.vibrate) navigator.vibrate(50);
        }

        ctx.lineWidth = 8;          
        ctx.lineCap = 'round';      
        ctx.lineJoin = 'round';      
        ctx.shadowBlur = 1;          
        ctx.shadowColor = '#000000'; 
        ctx.strokeStyle = '#000000'; 
        let drawing = false;

        function getEventPos(e) {
            const MathRect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            const x = (clientX - MathRect.left) * (canvas.width / MathRect.width);
            const y = (clientY - MathRect.top) * (canvas.height / MathRect.height);
            return { x, y };
        }

        function startDrawing(e) {
            if (systemLocked || canvas.classList.contains('locked') || !model) return;
            e.preventDefault();

            if (!isTiming) {
                startTimer();
            }

            drawing = true;
            ctx.beginPath();
            const pos = getEventPos(e);
            ctx.moveTo(pos.x, pos.y);
        }

        function moveDrawing(e) {
            if (!drawing) return;
            e.preventDefault();
            const pos = getEventPos(e);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
        }

        async function endDrawing(e) {
            if (drawing) {
                e.preventDefault();
                drawing = false;
                
                await processStroke();
                clearCanvas();
            }
        }

        function clearCanvas() {
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function startTimer() {
            isTiming = true;
            startTime = performance.now();
            timerInterval = setInterval(() => {
                const elapsedTime = (performance.now() - startTime) / 1000;
                timerDisplay.innerHTML = `タイム: ${elapsedTime.toFixed(2)} 秒`;
            }, 50);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            isTiming = false;
        }

        function resetTimerDisplay() {
            stopTimer();
            timerDisplay.innerHTML = "タイム: 0.00 秒";
            timerDisplay.style.color = "#00ff66";
        }

        function togglePINVisibility() {
            if (savedPIN.length === 0) return;
            isPINVisible = !isPINVisible; 
            
            const viewBtn = document.getElementById('viewBtn');
            if (isPINVisible) {
                viewBtn.innerText = "登録図形を隠す";
            } else {
                viewBtn.innerText = "登録図形を確認";
            }
            updatePINDisplay();
        }

        function updatePINDisplay() {
            if (savedPIN.length === 0) {
                pinPreview.innerHTML = "登録された図形: (未登録)";
                return;
            }

            let prefix = isFixedAnswerMode ? "固定の答え: " : "登録された図形: ";
            let text = prefix;
            savedPIN.forEach((val) => {
                if (isPINVisible) {
                    text += `[${val}] `;
                } else {
                    text += `[*] `;
                }
            });
            pinPreview.innerHTML = text;
        }

        function restartInputOnly() {
            if (!model) return;

            const confirmMsg = isFixedAnswerMode
                ? "入力状態をリセットして、最初から入力し直しますか？"
                : (isAuthMode 
                    ? "入力状態をクリアして最初から入力し直しますか？\n（※登録された図形データは維持されます）"
                    : "登録途中のデータを破棄して1つ目から描き直しますか？");

            if (!confirm(confirmMsg)) return;

            canvas.classList.remove('locked'); 

            if (isAuthMode || isFixedAnswerMode) {
                inputCount = 0;
                hasFailedTransition = false;
                systemLocked = false;

                resetTimerDisplay();

                if (isFixedAnswerMode) {
                    statusDisplay.innerHTML = " 固定答えモード ";
                    statusDisplay.style.color = "#00e5ff";
                    resultDisplay.innerHTML = "入力状態をリスタートしました。順番に入力してください。 [進行度: _ _ _ _]";
                    resultDisplay.style.color = "#00e5ff";
                } else {
                    statusDisplay.innerHTML = " 図形認証モード実行中 ";
                    statusDisplay.style.color = "#ffca28";
                    resultDisplay.innerHTML = "登録データを維持してリスタートしました。1回目から入力してください。 [進行度: _ _ _ _]";
                    resultDisplay.style.color = "#aaa";
                }
            } else {
                savedPIN = [];
                inputCount = 0;
                hasFailedTransition = false;
                isPINVisible = false;
                
                localStorage.removeItem("savedPIN");
                resetTimerDisplay();

                statusDisplay.innerHTML = " 図形登録ステップ ";
                statusDisplay.style.color = "#00e5ff";
                resultDisplay.innerHTML = "一筆書きで図形を描いてください。指を離すと自動で登録されます (0/4)";
                statusDisplay.style.color = "#aaa";
                
                document.getElementById('viewBtn').innerText = "登録図形を確認";
                document.getElementById('viewBtn').disabled = true;
                document.getElementById('actionBtn').innerText = "認証モードへ移行";
                document.getElementById('actionBtn').disabled = true;
                
                updatePINDisplay();
            }
            
            clearCanvas();
            if (navigator.vibrate) navigator.vibrate(100);
        }

        async function processStroke() {
            if (!model) return;

            const prediction = await model.predict(canvas);
            let topClass = "";
            let topProb = 0;

            let debugText = "";
            prediction.forEach(p => {
                let probPercent = Math.round(p.probability * 100);
                debugText += `${p.className}: ${probPercent}% | `;
                if (p.probability > topProb) {
                    topProb = p.probability;
                    topClass = p.className;
                }
            });
            
            const formattedLabels = labels.map(label => {
                const icon = svgIcons[label] || label;
                return `<span class="label-badge">${icon}</span>`;
            }).join("");
            debugInfo.innerHTML = "対応モデルラベル: " + formattedLabels + "<br>" + debugText;

            let topClassPercent = Math.round(topProb * 100);

            if (!isAuthMode && !isFixedAnswerMode) {
                if (savedPIN.length < 4) {
                    savedPIN.push(topClass);
                    updatePINDisplay();
                    resultDisplay.innerHTML = `「${topClass}」(${topClassPercent}%) を登録しました (${savedPIN.length}/4)`;
                    if (navigator.vibrate) navigator.vibrate(50);

                    document.getElementById('viewBtn').disabled = false;

                    if (savedPIN.length === 4) {
                        stopTimer(); 
                        const finalTime = ((performance.now() - startTime) / 1000).toFixed(2);
                        timerDisplay.innerHTML = `登録タイム: ${finalTime} 秒`;

                        resultDisplay.innerHTML = `4つの図形登録が完了！[最後: ${topClass}(${topClassPercent}%)] 「認証モードへ移行」を押してください。`;
                        document.getElementById('actionBtn').disabled = false;
                        localStorage.setItem("savedPIN", JSON.stringify(savedPIN));
                        canvas.classList.add('locked');
                    }
                }
            } 
            else {
                const requiredClass = savedPIN[inputCount];
                const targetPredict = prediction.find(p => p.className === requiredClass);
                const targetProb = targetPredict ? targetPredict.probability : 0;

                if (targetProb < 0.85) {
                    hasFailedTransition = true;
                }

                inputCount++; 
                if (navigator.vibrate) navigator.vibrate(60);

                let progressStr = "";
                for (let i = 0; i < 4; i++) {
                    progressStr += (i < inputCount) ? "● " : "_ ";
                }

                if (inputCount === 4) {
                    stopTimer(); 
                    const finalTime = ((performance.now() - startTime) / 1000).toFixed(2);
                    canvas.classList.add('locked');

                    if (!hasFailedTransition) {
                        systemLocked = true; 
                        statusDisplay.innerHTML = "認証成功 / ACCESS GRANTED";
                        statusDisplay.style.color = "#4caf50";
                        resultDisplay.innerHTML = `すべての図形が一致！`;
                        resultDisplay.style.color = "#4caf50";
                        
                        timerDisplay.innerHTML = `突破タイム: ${finalTime} 秒`;
                        timerDisplay.style.color = "#4caf50";

                        if (navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 300]);

                        successCount++;
                        localStorage.setItem("ai_successCount", successCount);
                    } else {
                        inputCount = 0;
                        hasFailedTransition = false; 
                        
                        statusDisplay.innerHTML = "認証失敗 / ACCESS DENIED";
                        statusDisplay.style.color = "#f44336";
                        resultDisplay.innerHTML = `リスタートか登録からやり直してください`;
                        resultDisplay.style.color = "#f44336";
                        
                        timerDisplay.innerHTML = `失敗タイム: ${finalTime} 秒`;
                        timerDisplay.style.color = "#f44336";

                        if (navigator.vibrate) navigator.vibrate([200, 100, 200]);

                        errorCount++;
                        localStorage.setItem("ai_errorCount", errorCount);
                    }
                    updateCounterDisplay();
                } else {
                    resultDisplay.innerHTML = `入力中... [進行度: ${progressStr.trim()}]`;
                }
            }
        }

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', moveDrawing);
        window.addEventListener('mouseup', endDrawing);

        canvas.addEventListener('touchstart', startDrawing, { passive: false });
        canvas.addEventListener('touchmove', moveDrawing, { passive: false });
        window.addEventListener('touchend', endDrawing, { passive: false });

        window.addEventListener('load', initAI);
    </script>
</body>
</html>
